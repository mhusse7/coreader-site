<!doctype html><meta charset="utf-8"><title>Sending…</title>
<script>
// Hands the press screenshots to the App Store Connect tab that opened this page.
const files = (new URLSearchParams(location.search).get('f') || 'mac-1.png').split(',');
Promise.all(files.map(f => fetch(f, {cache: 'no-store'}).then(r => r.blob()).then(b => ({name: f, blob: b}))))
  .then(list => { window.opener.postMessage({coreaderShots: list}, 'https://appstoreconnect.apple.com'); window.close(); });
</script>
